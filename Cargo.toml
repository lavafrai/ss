[package]
name = "ss"
version = "0.1.0"
edition = "2024"
description = "A searchable terminal menu for SSH hosts"
repository = "https://github.com/lavafrai/ss"

[dependencies]
ratatui = { version = "0.30", default-features = false }
skim = { version = "5.7", default-features = false }
ssh2-config = "0.8"
tokio = { version = "1", features = ["rt-multi-thread"] }
unicode-width = "0.2"
